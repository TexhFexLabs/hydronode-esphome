substitutions:
  device_name: hydronode-dht22
  friendly_name: HydroNode DHT22

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret esphome_api_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: git
      url: https://github.com/TexhFexLabs/hydronode-esphome
      ref: main
    components: [hydronode]
    refresh: 1d

http_request:
  id: hydronode_http
  timeout: 10s
  verify_ssl: true

time:
  - platform: sntp
    id: hydronode_time
    timezone: UTC

sensor:
  - platform: dht
    pin: GPIO4
    model: DHT22
    update_interval: 60s
    temperature:
      id: air_temperature
      name: Air Temperature
      accuracy_decimals: 2
    humidity:
      id: air_humidity
      name: Relative Humidity
      accuracy_decimals: 2

hydronode:
  id: hydronode_cloud
  http_request_id: hydronode_http
  time_id: hydronode_time
  sensor_id: !secret hydronode_sensor_id
  device_secret: !secret hydronode_device_secret
  update_interval: 60s
  measurements:
    - source: air_temperature
      type: TEMPERATURE
    - source: air_humidity
      type: HUMIDITY
